services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bermi
      POSTGRES_PASSWORD: bermi
      POSTGRES_DB: bermi_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bermi -d bermi_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://bermi:bermi@postgres:5432/bermi_ai
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-prod}
      LLM_API_BASE: ${LLM_API_BASE:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen/qwen3-32b}
      MODEL_DISPLAY_NAME: ${MODEL_DISPLAY_NAME:-Bermi AI v1}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMBEDDINGS_API_BASE: ${EMBEDDINGS_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-baai/bge-m3}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
