# Render Blueprint — deploys the Bermi AI backend on the FREE plan, using a
# free Supabase Postgres database (with pgvector) as storage.
#
# 1. Create a free database first: see "Database on Supabase" in DEPLOYMENT.md
# 2. In the Render dashboard: New → Blueprint → point at this repository.
# 3. When prompted, paste:
#      DATABASE_URL       — the Supabase "Session pooler" connection string
#      LLM_API_KEY        — your OpenRouter key
#      CORS_ORIGINS       — your Vercel frontend URL (add after Vercel deploy)
#      SUPER_ADMIN_EMAILS — your email
#
# Free-plan notes: the service sleeps after ~15 min idle (first request then
# takes ~30 s) and has no persistent disk, so original uploaded files and
# generated .docx files vanish on restart — chat history, documents' indexed
# text, embeddings, and citations all live in Supabase and are safe. For
# always-on + persistent files, switch plan to "starter" and add a disk.

services:
  - type: web
    name: bermi-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase Session-pooler URL — set in the dashboard
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_DISPLAY_NAME
        value: Bermi AI v1
      - key: LLM_API_KEY
        sync: false # set manually in the dashboard — never commit keys
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://bermi-ai.vercel.app
      - key: SUPER_ADMIN_EMAILS
        sync: false
